<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="topbar">
        <img src="title.png" alt="Geo Quiz">
    </div>

    <div class="main">
        <div class="menu-card">
            <h1>Choose a Gamemode</h1>
            <a href="GTF/index.html">
                <button>Guess the Flag</button>
            </a>
            <button disabled>Guess the Landmark</button>
        </div>
    </div>

    <button class="settings-btn" onclick="toggleSettings()">
        <img src="settingswheel.png" alt="Settings">
    </button>

    <div class="settings-panel" id="settingsPanel">
        <h2>Settings</h2>

        <div class="setting">
            <label>Background Color</label>
            <input type="color" onchange="setColor('--bg', this.value)">
        </div>
        <div class="setting">
            <label>Accent Color</label>
            <input type="color" onchange="setColor('--accent', this.value)">
        </div>
        <div class="setting">
            <label>Panel Color</label>
            <input type="color" onchange="setColor('--surface', this.value)">
        </div>

        <hr class="settings-divider">

        <div class="settings-themes-label">Themes</div>
        <div class="settings-themes-grid">
            <button onclick="setTheme('default')">Default</button>
            <button onclick="setTheme('sunset')">Sunset</button>
            <button onclick="setTheme('ocean')">Ocean</button>
            <button onclick="setTheme('midnight')">Midnight</button>
            <button onclick="setTheme('forest')">Forest</button>
            <button onclick="setTheme('purple')">Purple</button>
            <button onclick="setTheme('lava')">Lava</button>
            <button onclick="setTheme('ice')">Ice</button>
            <button onclick="setTheme('pink')">Pink</button>
            <button onclick="setTheme('gold')">Gold</button>
            <button onclick="setTheme('retro')">Retro</button>
            <button onclick="setTheme('neon')">Neon</button>
            <button onclick="setTheme('matrix')">Matrix</button>
            <button onclick="setTheme('space')">Space</button>
            <button onclick="setTheme('sky')">Sky</button>
            <button onclick="setTheme('mint')">Mint</button>
            <button onclick="setTheme('rose')">Rose</button>
            <button onclick="setTheme('amber')">Amber</button>
            <button onclick="setTheme('cyber')">Cyber</button>
            <button onclick="setTheme('mono')">Mono</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
